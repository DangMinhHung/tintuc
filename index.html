<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản Tin Sáng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#b8231b; --red-dark:#8f1a14; --ink:#1d1d1f; --muted:#6b6b70; --line:#e6e3df;
  --bg:#f4f2ef; --card:#fff; --top:#2a2a2d;
  --gold:#c99a2e; --up:#1f8a4c; --down:#c0392b;
  --c-gold:linear-gradient(135deg,#5a3d0a,#c99a2e 60%,#f1d27a);
  --c-rates:linear-gradient(135deg,#0b3b2e,#167a5b 60%,#4fc3a1);
  --c-weather:linear-gradient(135deg,#0f2f57,#2d6fb5 60%,#8ec5ff);
  --c-vn:linear-gradient(135deg,#5c0b0b,#b8231b 60%,#f0a04b);
  --c-world:linear-gradient(135deg,#14213d,#3a4f8a 60%,#8fa7d9);
  --c-ai:linear-gradient(135deg,#2a0f4d,#6b3fb8 60%,#c39bff);
  --c-outlook:linear-gradient(135deg,#1f2a2e,#3f5d63 60%,#9cc2c4);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Be Vietnam Pro",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:hover{color:var(--red)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Merriweather,Georgia,serif;margin:0}

/* top bar */
.topbar{background:var(--top);color:#cfcfd4;font-size:13px}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:38px;overflow:hidden}
.topbar .date{white-space:nowrap;color:#fff;font-weight:600;margin-left:auto;text-align:right}
.ticker{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.ticker span{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}
.ticker span b{color:#f1d27a;margin:0 10px}
@keyframes tick{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0}}

/* header */
header.main{background:var(--red);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15)}
header.main .wrap{display:flex;align-items:center;gap:20px;min-height:62px}
.logo{font-family:Merriweather,serif;font-weight:900;font-size:24px;letter-spacing:-.5px;white-space:nowrap}
.logo small{display:block;font:500 11px "Be Vietnam Pro";opacity:.8;letter-spacing:.5px;text-transform:uppercase}
nav.menu{display:flex;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{padding:20px 13px;font-weight:600;font-size:14px;white-space:nowrap}
nav.menu a:hover,nav.menu a.on{background:var(--red-dark);color:#fff}
.arch{background:var(--red-dark);color:#fff;border:0;border-radius:6px;padding:7px 10px;font:inherit;font-size:13px}

/* hero */
.hero{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:230px 230px;gap:4px;margin:20px 0 0}
.tile{position:relative;overflow:hidden;color:#fff;display:flex;align-items:flex-end;padding:22px;border-radius:2px}
.tile:first-child{grid-row:1/3}
.tile .ico{position:absolute;right:-20px;top:-20px;width:230px;height:230px;opacity:.16}
.tile:first-child .ico{width:380px;height:380px;right:-40px;top:-40px}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.tile>div{position:relative;z-index:1}
.chip{display:inline-block;background:rgba(0,0,0,.35);border-left:3px solid #fff;padding:2px 8px;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.tile h2{font-size:19px;line-height:1.35}
.tile:first-child h2{font-size:30px}
.tile p{margin:10px 0 0;font-size:14px;opacity:.92;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile:not(:first-child) p{display:none}
.tile .meta{font-size:12px;opacity:.8;margin-top:8px}

/* category bar */
.cats{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border:1px solid var(--line);margin:4px 0 24px}
.cats a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 4px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.cats a:last-child{border-right:0}
.cats a svg{width:26px;height:26px;color:var(--ink)}
.cats a:hover{color:var(--red);background:#fbf6f5}
.cats a:hover svg{color:var(--red)}

/* layout */
.grid{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}
section.blk{background:var(--card);border:1px solid var(--line);padding:22px;margin-bottom:24px;scroll-margin-top:80px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--line);margin-bottom:16px}
.hd h2{font-size:17px;text-transform:uppercase;letter-spacing:.3px;padding-bottom:8px;border-bottom:3px solid var(--red);margin-bottom:-2px;color:var(--red)}
.hd .src{font-size:12px;color:var(--muted)}
.lead{font-size:15.5px;margin:0 0 16px}

/* highlights */
.hl{background:#fff8e8;border:1px solid #f0dfb3;border-left:5px solid var(--gold);padding:16px 20px;margin-bottom:24px}
.hl h3{font-size:15px;margin-bottom:6px}
.hl ul{margin:0;padding-left:20px}
.hl li{margin:4px 0}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:#f6f4f1;text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.tbl th,.tbl td{padding:10px 10px;border-bottom:1px solid var(--line)}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tbl tr:hover td{background:#fcfbf9}
.scroll{overflow-x:auto}
.up{color:var(--up)} .down{color:var(--down)}
.best{background:#e9f7ef;color:var(--up);border-radius:4px;padding:1px 6px}
.na{color:#b0aaa3;font-weight:400;font-style:italic}

.goldtop{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat{border:1px solid var(--line);padding:14px 16px;border-radius:4px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat .v{font:900 26px Merriweather,serif;margin:2px 0}
.stat .s{font-size:12px;color:var(--muted)}
.factors{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.factor{border:1px solid var(--line);border-top:3px solid var(--muted);padding:12px 14px;font-size:14px}
.factor.up{border-top-color:var(--up)} .factor.down{border-top-color:var(--down)} .factor.mixed{border-top-color:var(--gold)}
.factor h4{margin:0 0 4px;font-size:14px;color:var(--ink)}
.factor .tag{font-size:11px;font-weight:700;text-transform:uppercase}
.factor p{margin:4px 0;color:#3a3a3d}

/* news */
.news{display:grid;gap:0}
.item{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .num{font:900 34px Merriweather,serif;color:#ece7e1;line-height:1}
.item h3{font-size:16px;line-height:1.4}
.item p{margin:5px 0 4px;color:#3a3a3d;font-size:14px}
.meta{font-size:12px;color:var(--muted)}
.meta a{color:var(--red);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.card .band{height:90px;background:var(--c-ai);position:relative}
.card .band svg{position:absolute;right:10px;bottom:-14px;width:80px;height:80px;color:#fff;opacity:.3}
.card .in{padding:14px}
.card h3{font-size:15px;line-height:1.4}
.card p{font-size:13.5px;color:#3a3a3d;margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.two h3.sub{font-family:"Be Vietnam Pro";font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
.ol{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:10px 0}
.ol h4{margin:0;font-size:14.5px}
.ol p{margin:3px 0;font-size:14px;color:#3a3a3d}
.verdict{background:#f6f4f1;padding:14px 16px;border-radius:4px;margin-bottom:16px}
.verdict b{color:var(--red)}

/* sidebar */
aside .blk{padding:18px}
.wx{display:grid;gap:10px}
.wday{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;background:linear-gradient(90deg,#eef5ff,#fff)}
.wday svg{width:44px;height:44px;color:#2d6fb5}
.wday .d{font-weight:700;font-size:14px}
.wday .x{font-size:12px;color:var(--muted)}
.wday .t{font:900 18px Merriweather,serif;text-align:right;white-space:nowrap}
.wday .t small{display:block;font:500 12px "Be Vietnam Pro";color:var(--muted)}
.alert{background:#fdecea;border-left:4px solid var(--down);padding:10px 12px;font-size:13.5px;margin-top:12px}
.warn{font-size:13.5px;margin:0;padding-left:18px;color:#7a5a12}
.arlist{list-style:none;margin:0;padding:0;font-size:14px}
.arlist li a{display:block;padding:7px 0;border-bottom:1px dashed var(--line)}
.arlist li a.on{color:var(--red);font-weight:700}
.srcs{font-size:12.5px;margin:0;padding-left:18px;word-break:break-word}
.srcs li{margin:3px 0}

footer{background:var(--top);color:#bdbdc2;font-size:13px;padding:22px 0;margin-top:10px}
.empty{background:var(--card);border:1px dashed #cfc8bf;padding:48px 24px;text-align:center;margin:24px 0;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:8px}

@media (max-width:980px){
  .grid{grid-template-columns:1fr}
  .cats{grid-template-columns:repeat(4,1fr)}
  .cats a:nth-child(4){border-right:0}
  .cats a:nth-child(-n+4){border-bottom:1px solid var(--line)}
}
@media (max-width:720px){
  header.main .wrap{flex-wrap:wrap;gap:0;padding-top:8px}
  nav.menu{margin-left:0;width:100%}
  nav.menu a{padding:12px 10px}
  .arch{margin-left:auto}
  .hero{grid-template-columns:1fr;grid-template-rows:300px 180px 180px}
  .tile:first-child{grid-row:auto}
  .tile:first-child h2{font-size:22px}
  .goldtop,.two{grid-template-columns:1fr}
  .item{grid-template-columns:1fr}
  .item .num{display:none}
  section.blk{padding:16px}
  .topbar .date{font-size:12px}
}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <div class="ticker"><span id="ticker"></span></div>
  <div class="date" id="topdate">Bản tin sáng</div>
</div></div>

<header class="main"><div class="wrap">
  <a class="logo" href="#top">Bản Tin Sáng<small>Tổng hợp mỗi ngày lúc 8:00</small></a>
  <nav class="menu" id="menu">
    <a href="#gold">Giá vàng</a><a href="#rates">Lãi suất</a><a href="#weather">Thời tiết</a>
    <a href="#vn">Trong nước</a><a href="#world">Quốc tế</a><a href="#ai">AI</a><a href="#outlook">Nhận định</a>
  </nav>
  <select class="arch" id="archSel" aria-label="Chọn ngày"></select>
</div></header>

<main class="wrap" id="top">
  <div id="app"></div>
</main>

<footer><div class="wrap">
  Bản tin do AI tổng hợp tự động từ các nguồn được dẫn link, chỉ để tham khảo, không phải lời khuyên đầu tư hay tài chính.
  Số liệu ghi "chưa xác minh" là chưa tìm được nguồn đáng tin cậy.
</div></footer>

<!-- SVG icons -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-gold" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 18h8l-1.5-5h-5zM13 18h8l-1.5-5h-5zM8 11h8l-1.5-5h-5z"/></symbol>
    <symbol id="i-rates" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 9l9-5 9 5M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/></symbol>
    <symbol id="i-weather" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 11a3.5 3.5 0 0 0 1 7z"/></symbol>
    <symbol id="i-vn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 21V4M5 4h13l-2.5 4L18 12H5"/><path d="M11.5 6.2l.6 1.3 1.4.1-1.1.9.4 1.4-1.3-.8-1.2.8.4-1.4-1.1-.9 1.4-.1z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-world" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></symbol>
    <symbol id="i-ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9.5 15l1.5-6h2l1.5 6M10 13h4M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></symbol>
    <symbol id="i-outlook" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M4 16l5-5 4 3 7-8M15 6h5v5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="#f5b52e" stroke="#e09b10"/><path stroke="#e09b10" d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-partly" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="9" cy="9" r="4" fill="#f5b52e" stroke="#e09b10"/><path d="M8 20h9a3.5 3.5 0 0 0 .4-6.97A5 5 0 0 0 8 13.5 3.2 3.2 0 0 0 8 20z" fill="#dfe8f3" stroke="#7d93ad"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24" stroke-width="1.5"><path d="M7 19h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 12a3.5 3.5 0 0 0 1 7z" fill="#dfe8f3" stroke="#7d93ad"/></symbol>
    <symbol id="i-rain" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round"><path d="M7 15h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 8a3.5 3.5 0 0 0 1 7z" fill="#cfdbea" stroke="#5f7a9b"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3" stroke="#2d6fb5"/></symbol>
    <symbol id="i-storm" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 7a3.5 3.5 0 0 0 1 7z" fill="#b9c4d2" stroke="#4b5d73"/><path d="M12.5 14l-2 4h3l-2 4" fill="none" stroke="#e09b10"/></symbol>
  </defs>
</svg>

<script>
(function(){
  var DATA_DIR = "data/";
  var CAT = {
    gold:{name:"Giá vàng",ico:"i-gold",bg:"var(--c-gold)"},
    rates:{name:"Lãi suất",ico:"i-rates",bg:"var(--c-rates)"},
    weather:{name:"Thời tiết",ico:"i-weather",bg:"var(--c-weather)"},
    vn:{name:"Trong nước",ico:"i-vn",bg:"var(--c-vn)"},
    world:{name:"Quốc tế",ico:"i-world",bg:"var(--c-world)"},
    ai:{name:"Xu hướng AI",ico:"i-ai",bg:"var(--c-ai)"},
    outlook:{name:"Nhận định",ico:"i-outlook",bg:"var(--c-outlook)"}
  };
  var NA = '<span class="na">chưa xác minh</span>';

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function has(v){ return v!==null && v!==undefined && v!==""; }
  function t(v){ return has(v) ? esc(v) : NA; }
  function safeUrl(u){ return (has(u) && /^https?:\/\//i.test(u)) ? esc(u) : null; }
  function src(o){
    if(!o) return "";
    var parts=[];
    if(has(o.time)) parts.push(esc(o.time));
    var u=safeUrl(o.url);
    if(has(o.source)) parts.push(u ? '<a href="'+u+'" target="_blank" rel="noopener">'+esc(o.source)+' ↗</a>' : esc(o.source));
    else if(u) parts.push('<a href="'+u+'" target="_blank" rel="noopener">Nguồn ↗</a>');
    return parts.length ? '<div class="meta">'+parts.join(" · ")+'</div>' : "";
  }
  function icon(id,cls){ return '<svg class="'+(cls||"")+'"><use href="#'+id+'"/></svg>'; }
  function arr(a){ return Array.isArray(a)?a:[]; }
  function head(id,title,o){
    var u=o&&safeUrl(o.url);
    var s=o&&has(o.source)? (u?'<a href="'+u+'" target="_blank" rel="noopener">'+esc(o.source)+' ↗</a>':esc(o.source)) : "";
    return '<div class="hd"><h2>'+title+'</h2>'+(s?'<span class="src">Nguồn: '+s+'</span>':'')+'</div>';
  }
  function chg(v){
    if(!has(v)) return '<span class="na">—</span>';
    var s=String(v), cls = /^\s*\+/.test(s)?"up":(/^\s*[-−]/.test(s)?"down":"");
    return '<span class="'+cls+'">'+esc(s)+'</span>';
  }
  function fmtDate(iso){ var p=String(iso).split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : iso; }

  function loadScript(file,ok,fail){
    var s=document.createElement("script"); s.src=DATA_DIR+file+"?v="+Date.now();
    s.onload=ok; s.onerror=fail; document.head.appendChild(s);
  }

  function renderEmpty(msg){
    document.getElementById("app").innerHTML =
      '<div class="empty"><h2>Chưa có bản tin</h2><p>'+msg+'</p></div>';
  }

  function render(D){
    var app=document.getElementById("app"), h="";
    document.getElementById("topdate").textContent = (has(D.updated)?"🕒 Cập nhật "+D.updated:"Ngày "+fmtDate(D.date));
    document.getElementById("ticker").innerHTML = arr(D.highlights).map(esc).join("<b>◆</b>") || "Bản tin sáng";

    // hero
    var f=arr(D.featured).slice(0,3);
    if(f.length){
      h+='<div class="hero">';
      f.forEach(function(it){
        var c=CAT[it.category]||CAT.vn, u=safeUrl(it.url);
        h+='<a class="tile" style="background:'+c.bg+'" href="'+(u||"#"+(it.category||"vn"))+'"'+(u?' target="_blank" rel="noopener"':'')+'>'+
           icon(c.ico,"ico")+'<div><span class="chip">'+c.name+'</span><h2>'+t(it.title)+'</h2>'+
           (has(it.summary)?'<p>'+esc(it.summary)+'</p>':'')+
           '<div class="meta" style="color:#fff">'+[it.source,it.time].filter(has).map(esc).join(" · ")+'</div></div></a>';
      });
      h+='</div>';
    }

    // category bar
    h+='<div class="cats">';
    Object.keys(CAT).forEach(function(k){ h+='<a href="#'+k+'">'+icon(CAT[k].ico)+CAT[k].name+'</a>'; });
    h+='</div>';

    if(arr(D.highlights).length){
      h+='<div class="hl"><h3>⚡ Điểm nhanh sáng nay</h3><ul>'+arr(D.highlights).map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>';
    }

    h+='<div class="grid"><div>';

    // gold
    var G=D.gold||{};
    h+='<section class="blk" id="gold">'+head("gold","Giá vàng hôm nay");
    if(has(G.summary)) h+='<p class="lead">'+esc(G.summary)+'</p>';
    var W=G.world||{}, sjc=arr(G.domestic)[0]||{};
    h+='<div class="goldtop">'+
       '<div class="stat"><div class="k">'+t(sjc.name||"Vàng trong nước")+' · bán ra</div><div class="v" style="color:var(--gold)">'+t(sjc.sell)+'</div><div class="s">nghìn đồng/lượng · '+chg(sjc.change)+'</div></div>'+
       '<div class="stat"><div class="k">Vàng thế giới</div><div class="v">'+t(W.price)+'</div><div class="s">USD/ounce · '+chg(W.change)+'</div>'+src(W)+'</div></div>';
    if(arr(G.domestic).length){
      h+='<div class="scroll"><table class="tbl"><thead><tr><th>Loại vàng</th><th style="text-align:right">Mua vào</th><th style="text-align:right">Bán ra</th><th style="text-align:right">Thay đổi</th><th>Nguồn</th></tr></thead><tbody>';
      G.domestic.forEach(function(r){
        var u=safeUrl(r.url);
        h+='<tr><td><b>'+t(r.name)+'</b></td><td class="n">'+t(r.buy)+'</td><td class="n">'+t(r.sell)+'</td><td class="n">'+chg(r.change)+'</td><td class="meta">'+
          (u?'<a href="'+u+'" target="_blank" rel="noopener">'+esc(r.source||"Nguồn")+' ↗</a>':t(r.source))+(has(r.time)?'<br>'+esc(r.time):'')+'</td></tr>';
      });
      h+='</tbody></table></div><div class="meta" style="margin-top:6px">Đơn vị: nghìn đồng/lượng</div>';
    }
    if(has(G.gap)) h+='<p style="margin:14px 0 0;font-size:14px"><b>Chênh lệch trong nước và thế giới:</b> '+esc(G.gap)+'</p>';
    if(arr(G.factors).length){
      h+='<h3 style="font-size:15px;margin-top:20px">Yếu tố ảnh hưởng</h3><div class="factors">';
      var EF={up:"▲ Đẩy giá lên",down:"▼ Kéo giá xuống",mixed:"◆ Tác động hai chiều"};
      G.factors.forEach(function(x){
        var e=EF[x.effect]?x.effect:"mixed";
        h+='<div class="factor '+e+'"><span class="tag '+e+'">'+EF[e]+'</span><h4>'+t(x.title)+'</h4><p>'+t(x.text)+'</p>'+src(x)+'</div>';
      });
      h+='</div>';
    }
    h+='</section>';

    // rates
    var R=D.rates||{}, terms=arr(R.terms).length?R.terms:["KKH","1T","3T","6T","9T","12T","24T","36T"];
    h+='<section class="blk" id="rates">'+head("rates","Lãi suất tiền gửi (%/năm)");
    if(arr(R.banks).length){
      var best=terms.map(function(_,i){ var m=-1; R.banks.forEach(function(b){ var v=parseFloat(String((b.values||[])[i]).replace(",",".")); if(!isNaN(v)&&v>m)m=v;}); return m; });
      h+='<div class="scroll"><table class="tbl"><thead><tr><th>Ngân hàng</th>'+terms.map(function(x){return '<th style="text-align:right">'+esc(x)+'</th>';}).join("")+'</tr></thead><tbody>';
      R.banks.forEach(function(b){
        h+='<tr><td><b>'+t(b.name)+'</b>'+src({source:b.source,url:b.url,time:b.updated})+'</td>';
        terms.forEach(function(_,i){
          var v=(b.values||[])[i], n=parseFloat(String(v).replace(",","."));
          var cnt = R.banks.filter(function(bb){ return parseFloat(String((bb.values||[])[i]).replace(",","."))===best[i]; }).length;
          var isBest = R.banks.length>1 && has(v) && !isNaN(n) && n===best[i] && cnt===1;
          h+='<td class="n">'+(has(v)?(isBest?'<span class="best">'+esc(v)+'</span>':esc(v)):'<span class="na">—</span>')+'</td>';
        });
        h+='</tr>';
      });
      h+='</tbody></table></div><div class="meta" style="margin-top:6px">Tiết kiệm cá nhân VND tại quầy. KKH = không kỳ hạn. Ô tô xanh = mức cao hơn ở kỳ hạn đó.</div>';
    } else h+='<p>'+NA+'</p>';
    if(has(R.note)) h+='<p style="font-size:14px;margin:12px 0 0">'+esc(R.note)+'</p>';
    h+='</section>';

    // news
    function newsBlock(id,title,list){
      var s='<section class="blk" id="'+id+'">'+head(id,title)+'<div class="news">';
      if(!arr(list).length) s+='<p>'+NA+'</p>';
      arr(list).forEach(function(n,i){
        var u=safeUrl(n.url);
        s+='<article class="item"><div class="num">'+String(i+1).padStart(2,"0")+'</div><div><h3>'+
           (u?'<a href="'+u+'" target="_blank" rel="noopener">'+t(n.title)+'</a>':t(n.title))+'</h3>'+
           (has(n.summary)?'<p>'+esc(n.summary)+'</p>':'')+src(n)+'</div></article>';
      });
      return s+'</div></section>';
    }
    h+=newsBlock("vn","Tin trong nước",D.newsVN);
    h+=newsBlock("world","Tin quốc tế",D.newsWorld);

    // AI
    h+='<section class="blk" id="ai">'+head("ai","Xu hướng AI đáng chú ý")+'<div class="cards">';
    if(!arr(D.ai).length) h+='<p>'+NA+'</p>';
    arr(D.ai).forEach(function(n){
      var u=safeUrl(n.url);
      h+='<div class="card"><div class="band">'+icon("i-ai")+'</div><div class="in"><h3>'+
         (u?'<a href="'+u+'" target="_blank" rel="noopener">'+t(n.title)+'</a>':t(n.title))+'</h3>'+
         (has(n.summary)?'<p>'+esc(n.summary)+'</p>':'')+src(n)+'</div></div>';
    });
    h+='</div></section>';

    // outlook
    var O=D.outlook||{};
    h+='<section class="blk" id="outlook">'+head("outlook","Nhận định 2–3 tháng tới");
    if(has(O.summary)) h+='<div class="verdict"><b>Nhận định tổng hợp:</b> '+esc(O.summary)+'</div>';
    function ol(list){ return arr(list).length ? arr(list).map(function(x){return '<div class="ol"><h4>'+t(x.title)+'</h4><p>'+t(x.text)+'</p>'+src(x)+'</div>';}).join("") : '<p>'+NA+'</p>'; }
    h+='<div class="two"><div><h3 class="sub">🇻🇳 Việt Nam</h3>'+ol(O.vn)+'</div><div><h3 class="sub">🌐 Thế giới</h3>'+ol(O.world)+'</div></div>';
    h+='<p class="meta" style="margin-top:12px">Phần nhận định chỉ để tham khảo, không phải lời khuyên đầu tư.</p></section>';

    h+='</div><aside>';

    // weather
    var X=D.weather||{};
    h+='<section class="blk" id="weather">'+head("weather","Thời tiết 3 ngày")+
       '<div class="meta" style="margin:-8px 0 12px">📍 '+t(X.location||"Bình Sơn, Quảng Ngãi")+'</div><div class="wx">';
    if(!arr(X.days).length) h+='<p>'+NA+'</p>';
    arr(X.days).forEach(function(d){
      var ic={sun:"i-sun",cloud:"i-cloud",rain:"i-rain",storm:"i-storm",partly:"i-partly"}[d.icon]||"i-partly";
      var extra=[has(d.rainProb)?"💧 "+esc(d.rainProb)+(String(d.rainProb).indexOf("%")<0?"%":""):"", has(d.rain)?esc(d.rain)+(String(d.rain).indexOf("mm")<0?" mm":""):"", has(d.wind)?"💨 "+esc(d.wind)+(String(d.wind).indexOf("km")<0?" km/h":""):""].filter(Boolean).join(" · ");
      h+='<div class="wday">'+icon(ic)+'<div><div class="d">'+[d.weekday,d.date].filter(has).map(esc).join(", ")+'</div><div class="x">'+t(d.desc)+'</div><div class="x">'+extra+'</div></div>'+
         '<div class="t">'+(has(d.tmax)?esc(d.tmax)+'°':'—')+'<small>'+(has(d.tmin)?esc(d.tmin)+'°':'—')+'</small></div></div>';
    });
    h+='</div>';
    if(has(X.alert)) h+='<div class="alert">⚠️ '+esc(X.alert)+'</div>';
    h+=src(X).replace('class="meta"','class="meta" style="margin-top:10px"')+'</section>';

    // warnings
    if(arr(D.warnings).length){
      h+='<section class="blk">'+head("w","Chưa xác minh được")+'<ul class="warn">'+D.warnings.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></section>';
    }

    // archive
    var A=arr(window.BANTIN_ARCHIVE);
    if(A.length){
      h+='<section class="blk">'+head("a","Bản tin các ngày trước")+'<ul class="arlist">'+A.slice(0,14).map(function(d){
        return '<li><a href="?d='+esc(d)+'"'+(d===D.date?' class="on"':'')+'>📰 Bản tin '+fmtDate(d)+'</a></li>';}).join("")+'</ul></section>';
    }

    // sources
    if(arr(D.sources).length){
      h+='<section class="blk">'+head("s","Nguồn tham khảo")+'<ol class="srcs">'+D.sources.map(function(s){
        var u=safeUrl(s.url); return '<li>'+(u?'<a href="'+u+'" target="_blank" rel="noopener">'+t(s.name||s.url)+'</a>':t(s.name))+'</li>';}).join("")+'</ol></section>';
    }

    h+='</aside></div>';
    app.innerHTML=h;
  }

  function fillArchive(current){
    var sel=document.getElementById("archSel"), A=arr(window.BANTIN_ARCHIVE);
    if(!A.length){ sel.style.display="none"; return; }
    sel.innerHTML=A.map(function(d){ return '<option value="'+esc(d)+'"'+(d===current?' selected':'')+'>'+fmtDate(d)+'</option>'; }).join("");
    sel.onchange=function(){ location.search="?d="+encodeURIComponent(sel.value); };
  }

  var q=new URLSearchParams(location.search).get("d");
  var want = (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) ? q+".js" : "latest.js";
  function go(){
    loadScript(want,function(){
      if(!window.BANTIN){ renderEmpty("File dữ liệu bị lỗi."); return; }
      render(window.BANTIN); fillArchive(window.BANTIN.date);
      if(location.hash){ var el=document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView(); }
    },function(){
      fillArchive(null);
      renderEmpty(q ? "Không tìm thấy bản tin ngày "+esc(fmtDate(q))+"." : "Bản tin đầu tiên sẽ được tạo tự động lúc 8:00 sáng. Hãy tải lại trang sau đó.");
    });
  }
  if(window.BANTIN_INLINE && window.BANTIN){
    // Bản đóng gói 1 file (gửi qua Drive): dữ liệu đã nhúng sẵn, không có lưu trữ
    window.BANTIN_ARCHIVE=[]; render(window.BANTIN); fillArchive(null);
  } else {
    loadScript("archive.js",go,go);
  }
})();
</script>
</body>
</html>
